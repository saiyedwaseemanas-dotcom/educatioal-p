name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, adding Android platform..."
            npx --yes @capacitor/cli add android
          fi
          echo "Syncing web assets to native Android..."
          npx --yes @capacitor/cli sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Configure Android SDK Location and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -f "android/gradlew" ]; then
            sed -i -e 's/\r$//' android/gradlew
            chmod +x android/gradlew
          fi
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            sed -i -e 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            sed -i -e 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Locate and Prepare APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output-apk/ \;
          echo "Generated APK files:"
          ls -la output-apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.run_number }}
          path: output-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
